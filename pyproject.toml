[project]
name = "wildlifeai"
version = "0.1.0"
description = "WildlifeAI is an open-source Python framework that turns raw camera trap images into structured wildlife intelligence using a configurable, end-to-end AI pipeline."
authors = [
    { name = "Dhruva", email = "dhruvavishwak9@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow (>=12.0.0,<13.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "wildlifeai", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10"
pillow = ">=12.0.0,<13.0.0"
torch = ">=2.0.0"
torchvision = ">=0.15.0"
timm = ">=0.9.0"
tqdm = ">=4.65.0"
numpy = ">=1.24.0"
matplotlib = ">=3.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
black = ">=23.0.0"
flake8 = ">=6.0.0"

[tool.poetry.scripts]
wildlifeai = "wildlifeai.cli:main"
