# SonarQube Cloud Configuration for WildlifeAI

sonar.projectKey=DhruvaHQ_wildlifeai
sonar.organization=dhruva

# Source code directory
sonar.sources=src
sonar.tests=tests

# Python specific
sonar.python.version=3.10,3.11,3.12

# Code coverage
sonar.python.coverage.reportPaths=coverage.xml

# Exclude generated and vendor files
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/dist/**,**/build/**,**/.venv/**,**/venv/**

# Test exclusions
sonar.test.exclusions=**/test_*.py,**/*_test.py

# Coverage exclusions (files that don't need coverage)
sonar.coverage.exclusions=**/test_*.py,**/__init__.py,**/cli.py

# Code duplication threshold
sonar.cpd.python.minimumTokens=50
